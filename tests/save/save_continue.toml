# Save/load stage 2 (tools/menu_test.py, M5B): a new process starts with a copy of stage 1's saves
# (save_new.toml; run that first), loads the character through CONTINUE and reads the same screens. Every
# value and list row is compared with the reading taken just before saving, as text: glyph pixels only
# (metric "text", luma > 200; measured on these rectangles: identical text <= 0.3, a changed value 7.8 to
# 10.5), so the different scene behind the translucent panels does not matter. Value rectangles start right
# of their labels (a bright moon graphic sits behind "HP:" and "Luck:"). The selected inventory row is not
# compared (its highlight pulses); the selected item's name and description below it are. Rectangles only.
# Current HP is not compared: the game does not save it and starts a loaded character at full HP (measured:
# saved at 14/78, loaded at 78/78; the character file saved at 14 HP holds no field with that value;
# docs/SAVES.md). The maximum is compared: the whole value right-aligned, its last 23 columns ("78" without
# the slash), because a one-digit current HP (6/78, K24) moves it left.

[scenario]
description = "load the saved character via CONTINUE in a new process; status, equipment, items, inventory as saved"
seconds = 240
script_file = "save_continue.kufscript"
saves_from_run = "save_new"
log_expect = ["[kuf-input] context: gameplay",
              "[content] XamContentCreate 'Circle of Doom - Character Save' as 'savedisk:' flags 0x13 -> open"]
expect_saves = ["B13EBABEBABEBABE/424507D1/00000001/Circle of Doom - Character Save/KD_*"]
# Then the second save (save_reload.toml checks it in a third process).
log_sequence = ["@gameplay+2120 press Return", "(type 00000001): committed", "[kuf-input] context: start prompt"]

[format]
width = 1280
height = 720

# Status screen: name, level and the six values
[[region_diff]]
name = "status level as saved"
a = "prev:status_saved"
b = "status_loaded"
rect = [990, 50, 1150, 84]
metric = "text"
text_threshold = 150.0
max_mean_diff = 1.0

# The large name glyphs vary with the scene behind the panel (same name up to 1.3, another name >= 19)
[[region_diff]]
name = "status name as saved"
a = "prev:status_saved"
