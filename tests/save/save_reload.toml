# Save/load stage 3 (tools/menu_test.py, M5B): a third process loads the character saved again by stage 2
# (save_continue.toml: loaded, RB slot re-equipped, saved through Quit). Checks as in save_continue.toml
# (text metric, value rectangles; current HP is restored to full by the game, the maximum is compared).

[scenario]
description = "third process: the second save of the character (RB slot re-equipped) loads as saved"
seconds = 120
script_file = "save_reload.kufscript"
saves_from_run = "save_continue"
log_expect = ["[kuf-input] context: gameplay",
              "[content] XamContentCreate 'Circle of Doom - Character Save' as 'savedisk:' flags 0x13 -> open"]

[format]
width = 1280
height = 720

[[region_diff]]
name = "status HP maximum as saved"
a = "prev:status_resaved"
b = "status_reloaded"
rect = [606, 95, 760, 120]
metric = "text"
text_threshold = 200.0
align_x = "right"
keep_px = 23
max_mean_diff = 1.0

[[region_diff]]
name = "status level as saved"
a = "prev:status_resaved"
b = "status_reloaded"
rect = [990, 50, 1150, 84]
metric = "text"
text_threshold = 150.0
max_mean_diff = 1.0

# The large name glyphs vary with the scene behind the panel (same name up to 1.3, another name >= 19)
[[region_diff]]
name = "status name as saved"
a = "prev:status_resaved"
b = "status_reloaded"
rect = [570, 50, 760, 84]
metric = "text"
text_threshold = 185.0
max_mean_diff = 6.0

