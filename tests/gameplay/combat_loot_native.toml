# Combat, enemy defeat, loot and inventory with keyboard and mouse, following the tutorial into its first
# fight (tools/menu_test.py). The tutorial stays on (its route leads to the lizardmen; it also blocks the
# status screen during its camera lesson, so the "before" readings are taken where the fight starts).
# Outcomes come from the game's own screens, compared within the run: the status screen's EXP line and the
# inventory list before and after the fight. Rectangles only, no image content.
# The fight is real: damage, kills and drops vary between runs; the checks only need some of each. Drops are
# rare at this level, so the fight lasts about three minutes and ends with a pick-up sweep around the spot
# (a 2-minute fight without a sweep picked up nothing in two runs in a row on 2026-10-21). The 5 Small Red
# Potions (Q) are drunk from +6300, one every 700 frames, so some are left for the end of the fight and the
# sweep (K24: drunk from the start, the character died in 4 of 64 runs, all at +9740..+10400).

# Native rendering (M6C follow-up): combat_loot on a simulated 2560x1440 output, where Render Native renders the
# frame at 2x2 (2560x1440). The same script and checks as combat_loot.toml (the camera and the game do not depend on
# the render resolution; the captures are reduced to 1280x720 for the image rules).

# K24 (docs/KNOWN_ISSUES.md): which drops a death gets came from the seed it happened to meet, so a fight could drop
# nothing (no gold, no item: the loot rule failed in about one run in ten). --kuf_test_drop_seed starts every dead
# unit's drop decision from a known seed (0x370085B5): the game's own rolls, chances and tables decide, and a Red
# Lizardman's death takes the gold path (8 gold, collected without a button). The fight itself still varies; the
# rules below are unchanged. tests/gameplay/k24_check.py reads the decisions; gameplay.combat_loot_no_drops runs the
# same with the decisions skipped and must fail the loot rule alone.

[scenario]
args = ["--kuf_display_size=2560x1440", "--kuf_test_drop_seed=922781109"]
description = "Render Native 2560x1440: Tutorial route to the lizardmen, fight with potions, pick up loot, EXP gained, items in inventory"
