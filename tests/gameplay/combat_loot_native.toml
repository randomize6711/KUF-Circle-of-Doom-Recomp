capture_frames = []
log_expect = ["[kuf-input] context: gameplay"]
# The status screen opens after the fight (the Tab enters a menu before the capture): if the character died
# (K24, "Game Over"), the Tab does nothing and the region_diff rules below would compare the Game Over
# screen with the status screen, which differs everywhere and passed them (seen in 3 runs).
log_sequence = ["@menu#2+10400 tap Tab", "[kuf-input] context: menu", "@menu#2+10480 capture status_after"]

[format]
render_scale = [2, 2]
guest_coordinates = true

[[region]]
name = "status screen before the fight"
capture = "status_before"
rect = [570, 92, 760, 184]
min_std = 15.0

# EXP 0/100 -> EXP n/100 (enemies defeated).
[[region_diff]]
name = "EXP gained"
a = "status_before"
b = "status_after"
rect = [570, 152, 760, 184]
min_mean_diff = 3.0

# Loot: the Gold number changed (glyph pixels only; measured 0.09 unchanged, >= 2.9 for 100 -> 109), or items
# are listed. Either alone is legitimate: gold may not drop, and potions picked up can be used up by the Q
# presses during the fight (seen in a run: Gold 100 -> 109, inventory empty).
[[region_diff]]
name = "gold picked up"
a = "status_before"
b = "status_after"
rect = [910, 152, 1000, 184]
metric = "text"
min_mean_diff = 1.0
any_of = "loot"

[[region]]
name = "items in the inventory after the fight"
capture = "inventory_after"
rect = [110, 140, 580, 320]
min_std = 12.0
any_of = "loot"

[[range]]
name = "all captures are real images"
frames = [1, 1000000]
min_distinct = 300
