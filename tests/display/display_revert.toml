# Apply without keeping (M6C), on the simulated monitor (Apply is the last row since the M7 UI polish: eleven Downs
# from Mode, eleven Ups back): Windowed, Apply, then Back: the previous display
# (borderless) comes back at once (the rows show it again); Windowed and Apply again, and wait: after 15 s it
# reverts by itself. Nothing is saved (no
# pc_settings.toml is written).

