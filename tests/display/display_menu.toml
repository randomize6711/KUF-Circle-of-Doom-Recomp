# PC Settings > Display page in-game with the keyboard (M6C), on a simulated 21:9 monitor (--kuf_display_modes:
# 3440x1440 at 100 and 60 Hz, 2560x1080, 1920x1080, 1280x720; offscreen runs have no real monitor). CONTINUE from
# build/m6-saves/celine-shadows-depths-1; options menu, Settings, PC Settings; the categories, Down twice to Display
# (M7 feature 3), Return: Mode Borderless, Size 3440x1440 (the desktop), Monitor 1 Simulated, Widescreen
# On, Apply. Mode Left: Windowed (the size becomes the largest window smaller than the desktop, 2560x1080); Size
# Left: 1920x1080; Widescreen Right then Left (off, on: at once, no confirmation); down to Apply (the last row since
# the M7 UI polish; the list scrolls): the window becomes
# 1920x1080 and the row asks "Keep?"; Select keeps it. Back saves: pc_settings.toml [display] windowed 1920x1080.
# The next run (display_persist) starts from that file.

[scenario]
description = "Display page: mode, size, widescreen, apply and keep, saved"
seconds = 207
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
args = ["--kuf_display_modes=3440x1440@100,3440x1440@60,2560x1080@60,1920x1080@60,1280x720@60"]
script = """
500 tap Return
700 press Return
850 press Return
1000 press Down
1100 press Return
1300 repeat 60 until gameplay press Return
@gameplay+300 press Escape
@gameplay+400 press Down
@gameplay+450 press Down
@gameplay+500 press Down
@gameplay+550 press Down
@gameplay+650 press Return
@gameplay+800 press Down
@gameplay+830 press Down
@gameplay+860 press Down
@gameplay+890 press Down
@gameplay+920 press Down
@gameplay+950 press Down
@gameplay+980 press Down
@gameplay+1010 press Down
@gameplay+1110 press Return
@gameplay+1230 press Down
@gameplay+1260 press Down
@gameplay+1290 press Return
@gameplay+1760 capture display_page
@gameplay+1790 press Left
@gameplay+1860 capture windowed
@gameplay+1890 press Down
@gameplay+1920 press Left
@gameplay+1990 capture smaller
@gameplay+2020 press Down
@gameplay+2050 press Down
@gameplay+2080 press Right
@gameplay+2150 capture widescreen_off
@gameplay+2180 press Left
@gameplay+2210 press Down
@gameplay+2240 press Down
@gameplay+2270 press Down
@gameplay+2300 press Down
@gameplay+2330 press Down
@gameplay+2360 press Down
@gameplay+2390 press Down
@gameplay+2420 press Down
@gameplay+2450 press Return
@gameplay+2550 capture keep
@gameplay+2580 press Return
@gameplay+2680 capture kept
@gameplay+2710 press Escape
@gameplay+2760 press Escape
@gameplay+2810 press Escape
@gameplay+2910 press Escape
@gameplay+3110 capture gameplay
"""
capture_frames = []
expect_saves_unchanged = true
pc_settings_expect = { "display.mode" = "windowed", "display.width" = 1920, "display.height" = 1080, "display.refresh_millihertz" = 0, "display.widescreen" = true, "camera.modern_camera" = true }
log_sequence = [
    "[kuf-display] display: borderless 3440 x 1440 on 'Simulated'",
    "[kuf-pc-menu] PC Settings opened",
    "[kuf-pc-menu] display page",
    "[kuf-pc-menu] widescreen off",
    "[kuf-pc-menu] widescreen on",
    "[kuf-display] display: windowed 1920 x 1080 on 'Simulated'",
    "[kuf-pc-menu] display applied (windowed 1920 x 1080 on 'Simulated'): keep within 15 s or it reverts",
    "[kuf-pc-menu] display kept: windowed 1920x1080 refresh 0 mHz",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
    "[kuf-pc-menu] PC Settings closed",
]
log_absent = ["display not kept"]

[format]
width = 1280
height = 720

# The display page's rows (frame pixels): Mode, Size and Apply labels.
[[region_diff]]
name = "Mode row changed (Borderless -> Windowed)"
a = "display_page"
b = "windowed"
rect = [462, 142, 745, 172]
metric = "text"
min_mean_diff = 5.0
