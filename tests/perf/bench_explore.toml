# M8 benchmark workload (tools/bench.py): the M6A Shadow Depths exploration route (tests/perf/explore_shadows_depths.toml)
# shortened to about 160 s of play, without captures, with log marks for the measured window and the world load:
#   load_request    the Return that confirms CONTINUE's save slot (the load starts)
#   gameplay_enter  the game reached gameplay (context change); world load = load_request -> context gameplay
#   window_start / window_end   the measured window (@gameplay+600 .. +4800, 140 s of walking and camera turns)
# The intro skip repeats every 10 ticks (the source repeats every 60) so the load time has a 0.33 s resolution.
# Script times are game ticks (30 per second at every frame rate). Starts from build/m6-saves (read only, copied).

[scenario]
description = "M8 bench: Shadow Depths exploration (load, walk, camera turns)"
seconds = 225
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
script = """
500 tap Return
700 press Return
850 press Return
1000 press Down
1100 press Return
1101 log load_request
1300 repeat 10 until gameplay press Return
@gameplay+0 log gameplay_enter
