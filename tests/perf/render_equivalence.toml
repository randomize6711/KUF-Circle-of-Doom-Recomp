# M8 render equivalence (docs/PERFORMANCE.md section 7): one route with captures at fixed ticks (title menu, the save
# list, play: start, walk, turn; status, inventory, back in play, pause menu, resumed), CONTINUE from the fixture
# build/m6-saves/celine-shadows-depths-1 (a copy). Runs at the original 30 fps so each capture is a tick frame and the
# game's state at a tick is the same in every run (the fixed tick, K43). Used to compare a GPU change with its control:
#   run A (before) -> tools/capture_check.py baseline <A captures> build/references/<name>
#   run B (after) and run C (before again, the noise control) -> tools/capture_check.py compare <B or C> <reference>

[scenario]
description = "M8: render equivalence route (menus, play, status, inventory, pause)"
seconds = 120
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
script = """
500 tap Return
600 capture title_menu
700 press Return
800 capture after_continue
850 press Return
950 capture slot_list
1000 press Down
1100 press Return
1300 repeat 10 until gameplay press Return
@gameplay+60 capture play_start
@gameplay+100 down W
@gameplay+280 up W
@gameplay+300 capture play_walk
@gameplay+310 down L
@gameplay+335 up L
@gameplay+400 capture play_turn
@gameplay+450 tap Tab
@gameplay+530 capture status
@gameplay+540 tap PageDown
@gameplay+620 capture inventory
@gameplay+630 tap Escape
@gameplay+690 tap Escape
@gameplay+760 capture back_in_play
@gameplay+800 tap Escape
@gameplay+880 capture pause
@gameplay+890 tap Escape
@gameplay+960 capture resumed
@gameplay+970 log route_end
"""
log_expect = ["[kuf-input] context: gameplay", "route_end"]
