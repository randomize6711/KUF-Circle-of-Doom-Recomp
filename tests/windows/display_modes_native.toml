# Windows acceptance (M17, docs/WINDOWS_TEST.md B3): the Display page in the title SETTINGS on the real monitor (no
# simulated modes, no simulated output size): Fullscreen (exclusive, a mode of the monitor's), Apply, Keep; Windowed,
# Apply, Keep; Borderless, Apply, Keep; Back saves. Run by tools/windows/acceptance on Windows only (the real display
# modes); checked on Linux with tools/menu_test.py --verify-only. Apply is twelve Downs from Mode (the route of
# tests/display/display_revert.toml); each mode gets 300 ticks after Apply before Keep.

