# M15A: the menu pointer through real SDL events pushed into the window (motion, clicks, the wheel), not the script's
# driver shortcut (the offscreen window is 1024x768, the image letterboxed at y 96, a window pixel 1.25 guest pixels): 30 moves between the Settings categories at irregular times, each answered at the next tick. The
# hover latency (input event to the game's selection moved) is read from the trace: "<n> ms after the last move".

