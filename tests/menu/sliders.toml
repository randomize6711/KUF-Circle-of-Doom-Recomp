1860 tap MouseLeft
1930 capture mouse_page
1960 mouse 789 150 1280 720
1990 tap MouseLeft
2040 mouse 700 196 1280 720
2070 down MouseLeft
2100 mouse 630 196 1280 720
2130 up MouseLeft
2190 mouse 700 242 1280 720
2240 capture hover_empty_part
2270 tap MouseLeft
2330 mouse 785 150 1280 720
2360 down MouseLeft
2390 mouse 630 150 1280 720
2450 focus off
2480 focus on
2510 mouse 700 150 1280 720
2540 up MouseLeft
2600 press Escape
2660 mouse 300 194 1280 720
2700 tap MouseLeft
2770 mouse 789 150 1280 720
2800 tap MouseLeft
2860 mouse 789 196 1280 720
2890 tap MouseLeft
2950 capture camera_set
2980 press Escape
3040 mouse 300 148 1280 720
3080 tap MouseLeft
3160 capture display_page
3190 wheel -3
3250 capture display_wheel_down
3280 wheel 3
3340 mouse 820 470 1280 720
3370 tap MouseLeft
3430 capture display_scrolled
3460 mouse 820 400 1280 720
3490 down MouseLeft
3520 mouse 820 150 1280 720
3550 up MouseLeft
3610 press Escape
3670 press Escape
3770 capture title_list
"""
capture_frames = []
pc_settings_expect = { "mouse.sensitivity_horizontal" = 10, "mouse.sensitivity_vertical" = 10, "mouse.invert_y" = true, "camera.distance_percent" = 200, "camera.field_of_view_degrees" = 110 }
log_sequence = [
    "[kuf-pc-menu] PC Settings opened (title SETTINGS)",
    "[kuf-pc-menu] audio page",
    "[kuf-pc-menu] slider 0 (audio): set from the pointer",
    "[kuf-pc-menu] slider 1 (audio): set from the pointer",
    "[kuf-pc-menu] slider 1: released",
    "[kuf-pc-menu] mouse and keyboard page",
    "[kuf-pc-menu] slider 0 (mouse and keyboard): set from the pointer",
    "How far the camera turns per mouse movement, up and down.",
    "[kuf-pc-menu] slider 1 (mouse and keyboard): set from the pointer",
    "[kuf-pc-menu] slider 1: released",
    "Inverts the mouse's vertical axis",
    "[kuf-pc-menu] slider 0 (mouse and keyboard): set from the pointer",
    "[kuf-pc-menu] slider 0: released",
    "[kuf-pc-menu] camera page",
    "[kuf-pc-menu] slider 0 (camera): set from the pointer",
    "[kuf-pc-menu] slider 1 (camera): set from the pointer",
    "[kuf-pc-menu] display page",
    "[kuf-pointer] wheel -3: 3 direct step(s)",
    "[kuf-pointer] wheel 3: 3 direct step(s)",
    "[kuf-pc-menu] scrollbar (display): track",
    "[kuf-pc-menu] scrollbar (display): thumb",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
]
