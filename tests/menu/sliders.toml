# Sliders and the pointer (M15A, src/runtime/pc_settings_menu.cpp PointerSlider, RowPointerX; the Settings pages' two
# columns). Title SETTINGS, the mouse alone after the title prompt: Audio: a click on the SFX track, the Music knob
# dragged left and past the panel's right edge, released away from the slider over another row (nothing else acts).
# Mouse & Keyboard: a click at the end of Mouse Horizontal (20), Mouse Vertical dragged to the middle (10); hovering a
# slider and a row's empty part shows that row's description; a click on the empty part of Mouse Y-Axis steps it.
# A drag interrupted by losing the focus ends: moving the pointer later changes nothing, and it does not start again.
# Key Bindings is not opened by a release over it. Camera: clicks at the ends of Distance (200 %) and Field of View
# (110). Display: the wheel moves three rows and back; the scrollbar's track and thumb. Tracks: x 470-790 (layout
# space), rows y 150, 196, 242, 288.

[scenario]
description = "Sliders and rows with the mouse: click, drag, release, hover, wheel, scrollbar (title SETTINGS)"
seconds = 150
args = ["--kuf_trace_menu_pointer=true"]
script = """
500 tap Return
700 press Return
850 press Return
1000 mouse 640 519 1280 720
1120 press MouseLeft
1250 mouse 300 240 1280 720
1290 tap MouseLeft
1370 capture audio_page
1400 mouse 630 150 1280 720
1420 tap MouseLeft
1470 capture sfx_clicked
1500 mouse 700 196 1280 720
1530 down MouseLeft
1560 mouse 500 196 1280 720
1590 capture music_dragged_left
1620 mouse 1250 196 1280 720
1650 capture music_past_the_end
1680 mouse 300 288 1280 720
1700 up MouseLeft
1760 press Escape
