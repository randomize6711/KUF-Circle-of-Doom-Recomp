# M15A: the in-game menus with the mouse (K64, K65; src/runtime/menu_mouse.cpp, menu_pointer.cpp), from the Shadow
# Depths save (a copy): the status menu's equipment screen (hover rows, wheel, tabs, a row's item list with hover, wheel
# and a right click back), its footer entry to the inventory (hover, wheel), the Level Up button (a click beside the dialog changes nothing), the options menu (hover, a click on
# Settings, a right click back). Nothing is equipped or used: the saves stay as they are.

[scenario]
description = "Mouse in the in-game menus: equipment, item list, inventory, options"
seconds = 190
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
expect_saves_unchanged = true
args = ["--kuf_trace_menu_pointer=true", "--kuf_trace_scene_dump=true"]
