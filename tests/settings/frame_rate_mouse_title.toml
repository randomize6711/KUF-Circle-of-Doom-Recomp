# The frame-rate rows with the mouse in the title screen's SETTINGS (M6D D5; the pointer since M7; K66, M15.1). The keyboard opens
# SETTINGS (the categories); the pointer on Display, a left click opens it; the pointer on FPS (the sixth row, M7 UX fix 3); three
# left clicks step it 30 -> 60 -> 90 -> 120 (Select steps forward); a real SDL wheel event to Interpolation and a real SDL click on
# it (window 1024x768: x 240, y 437 is guest 300, 426): Off. Right click twice: the categories, the title list (the file written).
# The title screen and its menus are drawn over the title-loop movie, which keeps the render thread busy: render-only frames reach
# about 36 per second there whatever the setting (docs/HIGH_FPS.md 21.6), so frame_rate_check.py --min-fps 33 (more
# than one frame per tick: the setting reached the scheduler; no lock at 30).

[scenario]
description = "Frame-rate page with the mouse in the title SETTINGS: wheel, left click steps, right click back"
seconds = 90
script = """
500 tap Return
700 tap Escape
800 press Down
900 press Return
1000 mouse 300 150 1280 720
1040 press MouseLeft
1150 mouse 300 380 1280 720
1200 capture fps_row
1230 press MouseLeft
1270 press MouseLeft
1310 press MouseLeft
1350 log mark at_120
1680 sdl wheel -1 240 437
1740 sdl click left 240 437
1840 capture interpolation_off
1870 press MouseRight
1970 press MouseRight
2070 capture main_menu
"""
capture_frames = []
pc_settings_expect = { "frame_rate.limit_fps" = 120, "frame_rate.interpolation" = false }
log_expect = [
    "[kuf-pc-menu] PC Settings opened (title SETTINGS)",
    "frame rate 90 -> 120, interpolation true",
    "frame rate 120 -> 120, interpolation false",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
]

[format]
width = 1280
height = 720
