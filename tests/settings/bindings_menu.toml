# Key Bindings and Controller Buttons (M7 feature 5, docs/INPUT.md "Rebinding"; K66, M15.1) in the title SETTINGS, keyboard and
# an SDL virtual Xbox 360 pad. Mouse & Keyboard, Down three times to Key Bindings, Return; Down to Weapon A, Return (waits for a
# key), G: Weapon A is G. Return again, Escape: cancelled, nothing changed. Down past the eighth row scrolls the list (Ability
# selected, the list moved by four); Return, E: Ability is E, and Pick Up (E, Y) keeps only Y. Back twice, Controller, Controller
# Buttons, Return; Return on Weapon A, the pad's X: X acts as A (and A as X). Back three times: the file is written.

[scenario]
description = "Key Bindings and Controller Buttons pages: capture, cancel, scroll, swap, save"
seconds = 124
args = ["--kuf_input_script_pad=xbox360"]
script = """
100 pad connect
500 tap Return
700 tap Escape
800 press Down
900 press Return
1040 press Down
1070 press Down
1100 press Down
1130 press Return
1210 press Down
1240 press Down
1270 press Down
1300 press Return
1360 capture keys_page
1400 press Down
1430 press Down
1460 press Down
1490 press Down
1540 press Return
1600 capture waiting_for_key
1640 press G
1730 press Return
1790 press Escape
1850 press Down
1880 press Down
1910 press Down
1940 press Down
1970 press Down
2000 press Down
2030 press Down
2100 capture scrolled
2140 press Return
2220 press E
2310 capture ability_e
2350 press Escape
2410 press Escape
2470 press Down
2500 press Return
2560 press Down
2590 press Return
2650 capture buttons_page
2690 press Return
2770 pad press x
2860 capture remapped
2900 press Escape
2960 press Escape
3020 press Escape
3140 capture title_again
"""
capture_frames = []
pc_settings_expect = { "gameplay_keys.a" = "G", "gameplay_keys.right_trigger" = "E", "gameplay_keys.y" = "Y", "controller_buttons.a" = "x", "controller_buttons.x" = "a" }
log_sequence = [
    "[kuf-pc-menu] PC Settings opened (title SETTINGS)",
    "[kuf-pc-menu] key bindings page",
    "[kuf-pc-menu] waiting for a key for Weapon A",
    "[kuf-pc-menu] gameplay key: a = G",
    "[kuf-pc-menu] waiting for a key for Weapon A",
    "[kuf-pc-menu] cancelled (nothing changed)",
    "[kuf-pc-menu] waiting for a key for Ability",
    "[kuf-pc-menu] y no longer on E",
    "[kuf-pc-menu] gameplay key: right_trigger = E",
    "[kuf-pc-menu] controller buttons page",
    "[kuf-pc-menu] waiting for a button for Weapon A",
    "[kuf-input] controller buttons in gameplay: x as a, a as x",
    "[kuf-pc-menu] controller button: x acts as a",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
    "[kuf-pc-menu] PC Settings closed",
]

[format]
width = 1280
height = 720
