# Camera distance and field of view survive a restart (M6B final settings; category pages M7 feature 3): a new
# process starts with the pc_settings.toml that pc_settings_view wrote (130 %, 75 degrees; ctest orders them). The
# values are loaded at start and used by the camera from the first gameplay frame (the orbit distance 130 % of the
# game's, the projection 75 degrees), and the Camera page shows them. Then Restore Defaults (the categories' last row)
# and the Camera page again: 100 % and the game's own field of view; Back, Back writes the defaults to the file.

[scenario]
description = "Camera distance and field of view loaded after a restart; Restore Defaults resets them"
seconds = 172
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
pc_settings_from_run = "pc_settings_view"
args = ["--kuf_trace_modern_camera=true", "--kuf_trace_projection=true", "--kuf_trace_camera_orbit=true"]
script = """
500 tap Return
700 press Return
850 press Return
1000 press Down
1100 press Return
1300 repeat 60 until gameplay press Return
@gameplay+200 log mark loaded
@gameplay+280 log mark menu
@gameplay+300 press Escape
@gameplay+400 press Down
@gameplay+450 press Down
@gameplay+500 press Down
@gameplay+550 press Down
@gameplay+650 press Return
@gameplay+800 press Down
@gameplay+830 press Down
@gameplay+860 press Down
@gameplay+890 press Down
@gameplay+920 press Down
@gameplay+950 press Down
@gameplay+980 press Down
@gameplay+1010 press Down
@gameplay+1110 press Return
@gameplay+1140 press Down
@gameplay+1170 press Return
@gameplay+1240 capture camera_loaded
@gameplay+1270 press Escape
@gameplay+1300 press Down
@gameplay+1330 press Down
@gameplay+1360 press Down
@gameplay+1390 press Down
@gameplay+1420 press Down
@gameplay+1430 capture restore_defaults_selected
@gameplay+1460 press Return
@gameplay+1490 press Up
@gameplay+1520 press Up
@gameplay+1550 press Up
@gameplay+1580 press Return
@gameplay+1650 capture camera_defaults
@gameplay+1680 press Escape
@gameplay+1710 press Escape
@gameplay+1800 press Escape
@gameplay+1890 press Escape
@gameplay+2100 log mark restored
@gameplay+2300 log mark end
"""
capture_frames = []
expect_saves_unchanged = true
pc_settings_expect = { "camera.distance_percent" = 100, "camera.field_of_view_degrees" = 0, "camera.modern_camera" = true, "mouse.sensitivity_horizontal" = 4 }
log_expect = [
    "[kuf-input] context: gameplay",
    "[kuf-settings] loaded /run-data/user/pc_settings.toml",
    "distance 130% field of view 75",
    "[kuf-cam] projection: fov 0.8149 rad aspect 1.7778",
    "[kuf-pc-menu] PC settings restored to the defaults",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
]

[[scenario.log_value]]
name = "distance loaded (130 % of 707)"
after = "log mark loaded"
before = "log mark menu"
pattern = 'orbit: .*requested pitch -?[0-9.]+ distance ([0-9.]+)'
min = 900.0
max = 935.0

[[scenario.log_value]]
name = "distance after Restore Defaults"
after = "log mark restored"
before = "log mark end"
pattern = 'orbit: .*requested pitch -?[0-9.]+ distance ([0-9.]+)'
min = 690.0
max = 720.0

[format]
width = 1280
height = 720
