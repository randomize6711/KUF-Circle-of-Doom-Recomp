# Camera distance and field of view survive a restart (M6B final settings; categories since M7; K66, M15.1): a new process
# starts with the pc_settings.toml that pc_settings_view wrote (130 %, 75 degrees; ctest orders them). The values are loaded at
# start and used by the camera from the first gameplay frame (the orbit distance 130 % of the game's, the projection 75
# degrees), and the Camera page shows them. Then Restore Defaults (the categories' last row) and the Camera page again: 100 %
# and the game's own field of view; Back, Back writes the defaults to the file.

[scenario]
description = "Camera distance and field of view loaded after a restart; Restore Defaults resets them"
seconds = 137
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
pc_settings_from_run = "pc_settings_view"
args = ["--kuf_trace_modern_camera=true", "--kuf_trace_projection=true", "--kuf_trace_camera_orbit=true"]
script = """
500 tap Return
700 press Return
850 press Return
1000 press Down
1100 press Return
1300 repeat 60 until gameplay press Return
@gameplay+200 log mark loaded
@gameplay+310 log mark menu
@gameplay+360 press Escape
@gameplay+460 press Down
@gameplay+490 press Down
@gameplay+520 press Down
@gameplay+550 press Down
@gameplay+620 press Return
@gameplay+740 press Down
@gameplay+770 press Return
@gameplay+830 capture camera_loaded
@gameplay+870 press Escape
@gameplay+930 press Down
@gameplay+960 press Down
@gameplay+990 press Down
@gameplay+1020 press Down
@gameplay+1050 press Down
@gameplay+1110 capture restore_defaults_selected
@gameplay+1150 press Return
@gameplay+1210 press Up
@gameplay+1240 press Up
@gameplay+1270 press Up
@gameplay+1300 press Up
@gameplay+1330 press Up
@gameplay+1360 press Return
@gameplay+1420 capture camera_defaults
@gameplay+1460 press Escape
@gameplay+1520 press Escape
@gameplay+1640 press Escape
@gameplay+1900 log mark restored
@gameplay+2130 log mark end
"""
capture_frames = []
expect_saves_unchanged = true
pc_settings_expect = { "camera.distance_percent" = 100, "camera.field_of_view_degrees" = 0, "camera.modern_camera" = true, "mouse.sensitivity_horizontal" = 4 }
log_expect = [
    "[kuf-input] context: gameplay",
    "[kuf-settings] loaded /run-data/user/pc_settings.toml",
    "distance 130% field of view 75",
    "[kuf-cam] projection: fov 0.8149 rad aspect 1.7778",
    "[kuf-pc-menu] PC settings restored to the defaults",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
]

[[scenario.log_value]]
name = "distance loaded (130 % of 707)"
after = "log mark loaded"
before = "log mark menu"
pattern = 'orbit: .*requested pitch -?[0-9.]+ distance ([0-9.]+)'
min = 900.0
max = 935.0

[[scenario.log_value]]
name = "distance after Restore Defaults"
after = "log mark restored"
before = "log mark end"
pattern = 'orbit: .*requested pitch -?[0-9.]+ distance ([0-9.]+)'
min = 690.0
max = 720.0

[format]
width = 1280
height = 720
