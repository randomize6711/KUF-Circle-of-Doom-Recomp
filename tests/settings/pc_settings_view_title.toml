# The Camera page in the title screen's SETTINGS (M6B final settings; categories since M7; K66, M15.1), keyboard: SETTINGS (the
# categories); Down to Camera, Return. Distance Left x6 (100 -> 50 %, the minimum: the last Left does nothing), Down, Field of
# View Right x12 (the game's own -> 60 ... 110, the maximum: the last Right does nothing). Back to the categories, Back: the
# title list, the file written with the limits.

[scenario]
description = "Camera page in the title SETTINGS: minimum distance and maximum field of view, saved"
seconds = 88
script = """
500 tap Return
700 tap Escape
800 press Down
900 press Return
1040 capture categories
1080 press Down
1110 press Return
1170 capture camera_page
1210 press Left
1240 press Left
1270 press Left
1300 press Left
1330 press Left
1360 press Left
1390 press Down
1420 press Right
1450 press Right
1480 press Right
1510 press Right
1540 press Right
1570 press Right
1600 press Right
1630 press Right
1660 press Right
1690 press Right
1720 press Right
1750 press Right
1820 capture camera_limits
1860 press Escape
1920 press Escape
2060 capture main_menu
"""
capture_frames = []
pc_settings_expect = { "camera.distance_percent" = 50, "camera.field_of_view_degrees" = 110, "camera.modern_camera" = true }
log_expect = [
    "[kuf-pc-menu] title SETTINGS layout extended",
    "[kuf-pc-menu] PC Settings opened (title SETTINGS)",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
    "[kuf-pc-menu] PC Settings closed",
]

[format]
width = 1280
height = 720
