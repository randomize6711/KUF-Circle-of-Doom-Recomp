# M6D D5 runtime switching (docs/HIGH_FPS.md 21.4): CONTINUE from the Shadow Depths fixture, the frame-rate page
# (as frame_rate_menu): 30 -> 60 -> 90 -> 120 -> 90 -> 60 -> 30 -> ... -> 120 -> 144 -> 165 -> 240 -> Unlimited ->
# ... -> 60, Interpolation Off and On, each advanced row Off and On; back to the game, a walk with turns. The game's
# state traced per tick (--kuf_trace_game_state, --kuf_trace_camera_orbit). state_compare.py against frame_rate_switch_ignored (the same input, every change dropped, 30 fps throughout): the game's state equal at every tick.

