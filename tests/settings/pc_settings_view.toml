# The camera's distance and field of view (M6B final settings; categories since M7; K66, M15.1), in-game with the keyboard:
# CONTINUE from build/m6-saves/celine-shadows-depths-1 (read only; the run gets a copy), options menu (Escape), Settings: the
# categories; Down to Camera, Return (the labels show the values: Distance 100%, Field of View 58). Distance +3 (130%),
# Down, Field of View +4 (Original -> 60 -> 65 -> 70 -> 75); Down to Low Latency, Down does nothing. Back (Camera selected),
# Up to Display, Return, Back, Down to Camera, Return: the changed values shown. Back, Back saves and returns to the options
# menu. Back: gameplay with the new camera: the orbit distance 130 % of the game's (requested 919 units) and the projection 75
# degrees horizontally (vertical 0.8149 rad at the screen's 16:9). The next run (pc_settings_view_persist) starts from this file.

[scenario]
description = "Camera page: Distance and Field of View, applied to the camera, saved"
seconds = 147
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
args = ["--kuf_trace_modern_camera=true", "--kuf_trace_projection=true", "--kuf_trace_camera_orbit=true"]
script = """
500 tap Return
700 press Return
850 press Return
1000 press Down
1100 press Return
1300 repeat 60 until gameplay press Return
@gameplay+250 log mark before_menu
@gameplay+310 press Escape
@gameplay+410 press Down
@gameplay+440 press Down
@gameplay+470 press Down
@gameplay+500 press Down
@gameplay+570 press Return
@gameplay+690 capture categories
@gameplay+730 press Down
@gameplay+760 press Return
@gameplay+820 capture camera_defaults
@gameplay+860 press Right
@gameplay+890 press Right
@gameplay+920 press Right
@gameplay+950 press Down
@gameplay+980 press Right
@gameplay+1010 press Right
@gameplay+1040 press Right
@gameplay+1070 press Right
@gameplay+1140 capture camera_changed
@gameplay+1180 press Down
@gameplay+1210 press Down
@gameplay+1240 press Down
@gameplay+1270 press Down
@gameplay+1340 capture camera_last_row
@gameplay+1380 press Escape
@gameplay+1440 press Up
@gameplay+1470 press Return
@gameplay+1530 capture display_page
@gameplay+1570 press Escape
@gameplay+1630 press Down
@gameplay+1660 press Return
@gameplay+1720 capture camera_again
@gameplay+1760 press Escape
@gameplay+1820 press Escape
@gameplay+1940 capture options
@gameplay+1980 press Escape
@gameplay+2140 log mark after_menu
@gameplay+2210 capture gameplay_view
@gameplay+2450 log mark end
"""
capture_frames = []
expect_saves_unchanged = true
pc_settings_expect = { "camera.distance_percent" = 130, "camera.field_of_view_degrees" = 75, "camera.modern_camera" = true, "mouse.sensitivity_horizontal" = 4, "controller.camera_sensitivity" = 5 }
log_expect = [
    "[kuf-input] context: gameplay",
    "[kuf-settings] camera: modern true range 85 recenter false mouse 4/4 invert false stick 5 deadzone 25% distance 100% field of view original",
    "[kuf-cam] field of view: key 0.6000 rad, used 0.8149 rad (46.69 degrees vertical, 75.00 horizontal at 16:9), setting 75",
    "[kuf-cam] projection: fov 0.8149 rad aspect 1.7778",
]
log_sequence = [
    "[kuf-pc-menu] PC Settings opened",
    "[kuf-pc-menu] display page",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
    "[kuf-pc-menu] PC Settings closed",
]

# The camera before (the game's own distance) and after (130 %): the orbit's requested distance.
[[scenario.log_value]]
name = "distance before"
after = "log mark before_menu"
before = "press Escape"
pattern = 'orbit: .*requested pitch -?[0-9.]+ distance ([0-9.]+)'
min = 690.0
max = 720.0

[[scenario.log_value]]
name = "distance after (130 %)"
after = "log mark after_menu"
before = "log mark end"
pattern = 'orbit: .*requested pitch -?[0-9.]+ distance ([0-9.]+)'
relative_to = "distance before"
min = 205.0
max = 220.0

[format]
width = 1280
height = 720
