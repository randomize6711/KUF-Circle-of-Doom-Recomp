# M6D D5: as timing/k44_60.toml (K44, docs/HIGH_FPS.md section 18) with 60 fps from the PC settings
# (--kuf_pc_settings=frame_rate.limit_fps=60, the path the menu's setting takes, not --kuf_frame_rate): the tick at
# gameplay+600 (tick 2100 on this route) held 16000 us before it starts, so it begins late by nearly a frame step;
# the presentation clock traced from tick 2050 for 900 ticks. k44_check.py --rate 60: every following tick draws its
# two frames (the setting drives the K44-corrected clock).
[scenario]
description = "M6D D5: 60 fps from the PC settings drives the K44 frame clock: the frame rate holds after a late tick"
seconds = 150
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
script_file = "../timing/tick_route.txt"
args = ["--kuf_pc_settings=frame_rate.limit_fps=60", "--kuf_debug_tick_stall_at=2100", "--kuf_debug_tick_stall_us=16000",
        "--kuf_trace_frame_clock=2050"]
capture_frames = []
expect_saves_unchanged = true
log_expect = ["[kuf-input] context: gameplay", "[kuf-clock] test stall: tick 2100"]
