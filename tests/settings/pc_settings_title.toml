# The PC settings in the title screen's SETTINGS (M6B; categories since M7; K66, M15.1), with the keyboard (Escape on the
# storage prompt, as in the other menu tests). Settings opens on the categories: Display, Camera, Audio, Mouse & Keyboard,
# Controller, Gameplay, Restore Defaults.
# Mouse & Keyboard: Mouse Horizontal +1 (5). Back, Up to Camera, Return; Down to Modern Camera and Right (Off). Back
# (Camera selected), Down five times to Restore Defaults (not chosen). Back: the title list, pc_settings.toml written.

[scenario]
description = "PC settings in the title SETTINGS: categories, pages, save"
seconds = 90
script = """
500 tap Return
700 tap Escape
800 press Down
900 press Return
1040 capture categories
1080 press Down
1110 press Down
1140 press Down
1170 press Return
1230 capture mouse_keys
1270 press Right
1300 press Escape
1360 press Up
1390 press Up
1420 press Return
1480 press Down
1510 press Down
1540 press Down
1570 press Down
1600 press Right
1650 capture modern_off
1690 press Escape
1750 press Down
1780 press Down
1810 press Down
1840 press Down
1870 press Down
1930 capture restore_defaults_row
1970 press Escape
2110 capture main_menu
"""
capture_frames = []
log_absent = ["text cut to"]
pc_settings_expect = { "mouse.sensitivity_horizontal" = 5, "camera.modern_camera" = false, "camera.vertical_range_degrees" = 85 }
log_expect = [
    "[kuf-pc-menu] title SETTINGS layout extended",
    "[kuf-pc-menu] title SETTINGS: Change Storage Device removed (PC Settings in its place)",
    "[kuf-pc-menu] PC Settings opened (title SETTINGS)",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
    "[kuf-pc-menu] PC Settings closed",
]

[format]
width = 1280
height = 720

# The selected row of the categories and pages (M15.1): the row's own background, left of its label, is brighter when selected.
[[highlight]]
name = "selected row in the PC settings"
metric = "luma"
x = [180, 186]
rows = [150, 196, 242, 288, 334, 380, 426]
half_height = 10
min_margin = 8.0
expect = { "categories" = 0, "mouse_keys" = 0, "modern_off" = 4, "restore_defaults_row" = 6 }

[[range]]
name = "all captures are real images"
frames = [1, 1000000]
min_distinct = 300
