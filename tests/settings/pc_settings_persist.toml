# PC settings survive a restart (M6B; category pages M7 feature 3): a new process starts with the pc_settings.toml
# that pc_settings_keyboard wrote (run that scenario first; ctest orders them). The values are loaded at start, the
# modern camera uses them (log), and the Controls page shows them. Then Restore Defaults (the category page's last
# row) and Back: the file holds the defaults again (written atomically, the previous version kept as
# pc_settings.toml.bak).

[scenario]
description = "PC settings loaded after a restart; Restore Defaults saved"
seconds = 162
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
pc_settings_from_run = "pc_settings_keyboard"
script = """
500 tap Return
700 press Return
850 press Return
1000 press Down
1100 press Return
1300 repeat 60 until gameplay press Return
@gameplay+300 press Escape
@gameplay+400 press Down
@gameplay+450 press Down
@gameplay+500 press Down
@gameplay+550 press Down
@gameplay+650 press Return
@gameplay+800 press Down
@gameplay+830 press Down
@gameplay+860 press Down
@gameplay+890 press Down
@gameplay+920 press Down
@gameplay+950 press Down
@gameplay+980 press Down
@gameplay+1010 press Down
@gameplay+1080 capture pc_row_selected
@gameplay+1110 press Return
@gameplay+1210 capture categories
@gameplay+1240 press Return
@gameplay+1310 capture controls_loaded
@gameplay+1340 press Escape
@gameplay+1370 press Down
@gameplay+1400 press Down
@gameplay+1430 press Down
@gameplay+1460 press Down
@gameplay+1490 press Down
@gameplay+1520 press Down
@gameplay+1530 capture restore_defaults_selected
@gameplay+1560 press Return
@gameplay+1660 capture defaults_restored
@gameplay+1690 press Escape
@gameplay+1780 capture settings_page
@gameplay+1810 press Escape
@gameplay+1880 press Escape
@gameplay+1980 capture closed
"""
capture_frames = []
expect_saves_unchanged = true
pc_settings_expect = { "camera.modern_camera" = true, "camera.vertical_range_degrees" = 85, "camera.auto_recenter" = false, "mouse.sensitivity_horizontal" = 4, "mouse.sensitivity_vertical" = 4, "mouse.invert_y" = false, "controller.camera_sensitivity" = 5, "controller.camera_deadzone_percent" = 25 }
log_expect = [
    "[kuf-input] context: gameplay",
    "[kuf-settings] loaded /run-data/user/pc_settings.toml",
    "[kuf-settings] camera: modern true range 75 recenter true mouse 6/3 invert true stick 6 deadzone 20%",
    "[kuf-pc-menu] PC settings restored to the defaults",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
]

[format]
width = 1280
height = 720
