# PC settings survive a restart (M6B; categories since M7; K66, M15.1): a new process starts with the pc_settings.toml that
# pc_settings_keyboard wrote (run that scenario first; ctest orders them). The values are loaded at start, the modern
# camera uses them (log), and the Mouse & Keyboard page shows them. Then Restore Defaults (the categories' last row) and
# Back: the file holds the defaults again (written atomically, the previous version kept as pc_settings.toml.bak).

[scenario]
description = "PC settings loaded after a restart; Restore Defaults saved"
seconds = 118
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
pc_settings_from_run = "pc_settings_keyboard"
script = """
500 tap Return
700 press Return
850 press Return
1000 press Down
1100 press Return
1300 repeat 60 until gameplay press Return
@gameplay+300 press Escape
@gameplay+400 press Down
@gameplay+430 press Down
@gameplay+460 press Down
@gameplay+490 press Down
@gameplay+560 press Return
@gameplay+680 capture categories
@gameplay+720 press Down
@gameplay+750 press Down
@gameplay+780 press Down
@gameplay+810 press Return
@gameplay+870 capture mouse_keys_loaded
@gameplay+910 press Escape
@gameplay+970 press Down
@gameplay+1000 press Down
@gameplay+1030 press Down
@gameplay+1090 capture restore_defaults_selected
@gameplay+1130 press Return
@gameplay+1250 capture defaults_restored
@gameplay+1290 press Escape
@gameplay+1410 capture options
@gameplay+1450 press Escape
@gameplay+1570 capture closed
"""
capture_frames = []
expect_saves_unchanged = true
pc_settings_expect = { "camera.modern_camera" = true, "camera.vertical_range_degrees" = 85, "camera.auto_recenter" = false, "mouse.sensitivity_horizontal" = 4, "mouse.sensitivity_vertical" = 4, "mouse.invert_y" = false, "controller.camera_sensitivity" = 5, "controller.camera_deadzone_percent" = 25 }
log_expect = [
    "[kuf-input] context: gameplay",
    "[kuf-settings] loaded /run-data/user/pc_settings.toml",
    "[kuf-settings] camera: modern true range 75 recenter true mouse 6/3 invert true stick 6 deadzone 20%",
    "[kuf-pc-menu] PC settings restored to the defaults",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
]

[format]
width = 1280
height = 720
