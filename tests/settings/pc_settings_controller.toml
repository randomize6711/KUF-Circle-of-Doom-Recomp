# The PC settings with a controller (M6B; categories since M7; K66, M15.1): an SDL virtual Xbox 360 pad, as a player's
# controller. CONTINUE from build/m6-saves/celine-shadows-depths-1 (read only), Back opens the options menu, D-pad to
# Settings, A: the categories. D-pad to Controller, A, A: Stick Settings. Stick Horizontal +2 with D-pad right (7), Camera
# Dead Zone +1 with the left stick pushed right (30 %). B twice to the categories, D-pad up to Camera, A: down to Modern
# Camera, Off with D-pad right. B to the categories, B closes Settings (file written), B closes the options menu.

[scenario]
description = "PC settings with a controller: D-pad, left stick, A and B"
seconds = 134
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
args = ["--kuf_input_script_pad=xbox360"]
script = """
100 pad connect
500 pad press start
700 pad press a
850 pad press a
1000 pad press down
1100 pad press a
1300 repeat 60 until gameplay pad press a
@gameplay+300 pad press back
@gameplay+370 pad press down
@gameplay+400 pad press down
@gameplay+430 pad press down
@gameplay+460 pad press down
@gameplay+530 pad press a
@gameplay+650 capture categories
@gameplay+690 pad press down
@gameplay+720 pad press down
@gameplay+750 pad press down
@gameplay+780 pad press down
@gameplay+810 pad press a
@gameplay+870 pad press a
@gameplay+930 pad press right
@gameplay+960 pad press right
@gameplay+990 pad press down
@gameplay+1020 pad press down
@gameplay+1050 pad axis leftx 32767
@gameplay+1056 pad axis leftx 0
@gameplay+1176 capture sticks_changed
@gameplay+1216 pad press b
@gameplay+1276 pad press b
@gameplay+1336 pad press up
@gameplay+1366 pad press up
@gameplay+1396 pad press up
@gameplay+1426 pad press a
@gameplay+1486 pad press down
@gameplay+1516 pad press down
@gameplay+1546 pad press down
@gameplay+1576 pad press down
@gameplay+1606 pad press right
@gameplay+1676 capture camera_changed
@gameplay+1716 pad press b
@gameplay+1776 pad press b
@gameplay+1896 capture options
@gameplay+1936 pad press b
@gameplay+2056 capture closed
"""
capture_frames = []
expect_saves_unchanged = true
pc_settings_expect = { "camera.modern_camera" = false, "controller.camera_sensitivity" = 7, "controller.camera_deadzone_percent" = 30, "mouse.sensitivity_horizontal" = 4 }
log_expect = [
    "[kuf-input] context: gameplay",
    "[kuf-pc-menu] PC Settings opened",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
    "[kuf-pc-menu] PC Settings closed",
]

[format]
width = 1280
height = 720
