# Command line over the saved settings (M6D D5, docs/SETTINGS.md): pc_settings.toml says 60 fps with the effect clock
# off; --kuf_frame_rate=120 is given. The flag wins for this run (120 frames per second; the effect clock still off:
# only the flags given override), the log says so. In the menu Mouse Horizontal +1 (5); Back writes the file: the
# frame rate in it stays 60 (the command line is not saved), the mouse value is 5.

[scenario]
description = "--kuf_frame_rate over the saved frame rate for one run; the file keeps the saved value"
seconds = 178
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
pc_settings_file = "tests/settings/frame_rate_cli_pc_settings.toml.in"
args = ["--kuf_frame_rate=120", "--kuf_profile=true"]
script = """
500 tap Return
700 press Return
850 press Return
1000 press Down
1100 press Return
1300 repeat 60 until gameplay press Return
@gameplay+200 log mark play_a
@gameplay+210 down W
@gameplay+510 log mark play_b
@gameplay+520 up W
@gameplay+580 press Escape
@gameplay+680 press Down
@gameplay+730 press Down
@gameplay+780 press Down
@gameplay+830 press Down
@gameplay+930 press Return
@gameplay+1080 press Down
@gameplay+1110 press Down
@gameplay+1140 press Down
@gameplay+1170 press Down
@gameplay+1200 press Down
@gameplay+1230 press Down
@gameplay+1260 press Down
@gameplay+1290 press Down
@gameplay+1390 press Return
@gameplay+1540 press Return
@gameplay+1690 press Right
@gameplay+1750 capture mouse_5
@gameplay+1780 press Escape
@gameplay+1880 press Escape
@gameplay+1980 press Escape
@gameplay+2080 press Escape
@gameplay+2280 log mark play_c
@gameplay+2290 down W
@gameplay+2590 log mark play_d
@gameplay+2600 up W
"""
capture_frames = []
expect_saves_unchanged = true
pc_settings_expect = { "frame_rate.limit_fps" = 60, "frame_rate.interpolate_effects" = false, "mouse.sensitivity_horizontal" = 5 }
log_expect = [
    "[kuf-settings] frame rate: 60 interpolation true objects true animation true effects false",
    "[kuf-pacing] frame rate from the command line for this run (the saved settings unchanged): --kuf_frame_rate=120",
    "[kuf-pacing] render-only frames: up to 120 frames per second between the game's 30 ticks",
    "world objects: on, skeletal poses: on, effect clock: off",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
]

[format]
width = 1280
height = 720
