# The PC settings in the in-game Settings, with the keyboard (M6B; the categories since M7; K66, M15.1). CONTINUE from
# build/m6-saves/celine-shadows-depths-1 (read only; the run gets a copy), options menu (Escape), four Downs to Settings. Settings opens on the categories: Display, Camera, Audio, Mouse & Keyboard, Controller, Gameplay, Restore Defaults.
# Mouse & Keyboard (defaults: mouse 4/4, Normal): Mouse Horizontal +2 (6), Mouse Vertical -1 (3), Mouse Y-Axis Inverted.
# Back (the category stays selected); Controller > Stick Settings (stick 5, dead zone 25 %): Stick Horizontal +1 (6), Camera
# Dead Zone -1 (20 %). Back twice. Camera (range 85, recentring Off, modern On): Vertical Range one left (75), Recentering On;
# Modern Camera stays On, on to Low Latency. Back; Down to Restore Defaults (not chosen), Down does nothing, Up to Display.
# Back closes Settings: the options menu, pc_settings.toml written. Settings again, Mouse & Keyboard: the changed values are
# shown. Then everything is closed. The next run (pc_settings_persist) starts from this run's pc_settings.toml.

[scenario]
description = "The PC settings with the keyboard: navigation, every kind of row, save on Back"
seconds = 184
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
script = """
500 tap Return
700 press Return
850 press Return
1000 press Down
1100 press Return
1300 repeat 60 until gameplay press Return
@gameplay+300 press Escape
@gameplay+400 press Down
@gameplay+430 press Down
@gameplay+460 press Down
@gameplay+490 press Down
@gameplay+560 press Return
@gameplay+680 capture categories
@gameplay+720 press Down
@gameplay+750 press Down
@gameplay+780 press Down
@gameplay+810 press Return
@gameplay+870 capture mouse_keys_defaults
@gameplay+910 press Right
@gameplay+940 press Right
@gameplay+970 press Down
@gameplay+1000 press Left
@gameplay+1030 press Down
@gameplay+1060 press Right
@gameplay+1090 press Down
@gameplay+1120 press Down
@gameplay+1180 capture mouse_keys_changed
@gameplay+1220 press Escape
@gameplay+1280 capture categories_on_mouse_keys
@gameplay+1320 press Down
@gameplay+1350 press Return
@gameplay+1410 press Return
@gameplay+1470 press Right
@gameplay+1500 press Down
@gameplay+1530 press Down
@gameplay+1560 press Left
@gameplay+1620 capture sticks_changed
@gameplay+1660 press Escape
@gameplay+1720 press Escape
@gameplay+1780 press Up
@gameplay+1810 press Up
@gameplay+1840 press Up
@gameplay+1870 press Return
@gameplay+1930 press Down
@gameplay+1960 press Down
@gameplay+1990 press Left
@gameplay+2020 press Down
@gameplay+2050 press Left
@gameplay+2080 press Down
@gameplay+2110 press Down
@gameplay+2170 capture camera_changed
@gameplay+2210 press Escape
@gameplay+2270 press Down
@gameplay+2300 press Down
@gameplay+2330 press Down
@gameplay+2360 press Down
@gameplay+2390 press Down
@gameplay+2450 capture restore_defaults_selected
@gameplay+2490 press Down
@gameplay+2550 press Up
@gameplay+2580 press Up
@gameplay+2610 press Up
@gameplay+2640 press Up
@gameplay+2670 press Up
@gameplay+2730 capture back_on_camera
@gameplay+2770 press Up
@gameplay+2800 press Escape
@gameplay+2920 capture settings_closed
@gameplay+2960 press Return
@gameplay+3080 capture categories_again
@gameplay+3120 press Down
@gameplay+3150 press Down
@gameplay+3180 press Down
@gameplay+3210 press Return
@gameplay+3270 capture mouse_keys_kept
@gameplay+3310 press Escape
@gameplay+3370 press Escape
@gameplay+3430 press Escape
@gameplay+3550 capture closed
"""
capture_frames = []
# Only PC settings were changed: the game's own options (GlobalSetting) and the character files stay as they
# were, and pc_settings.toml holds exactly the changed values.
expect_saves_unchanged = true
pc_settings_expect = { "camera.modern_camera" = true, "camera.vertical_range_degrees" = 75, "camera.auto_recenter" = true, "mouse.sensitivity_horizontal" = 6, "mouse.sensitivity_vertical" = 3, "mouse.invert_y" = true, "controller.camera_sensitivity" = 6, "controller.camera_deadzone_percent" = 20 }
log_expect = [
    "[kuf-input] context: gameplay",
    "[kuf-pc-menu] in-game Settings layout extended",
    "[kuf-settings] no /run-data/user/pc_settings.toml yet: defaults",
]
log_sequence = [
    "[kuf-pc-menu] PC Settings opened",
    "[kuf-pc-menu] mouse and keyboard page",
    "[kuf-pc-menu] controller page",
    "[kuf-pc-menu] stick settings page",
    "[kuf-pc-menu] camera page",
    "[kuf-settings] saved /run-data/user/pc_settings.toml",
    "[kuf-pc-menu] PC Settings closed",
    "[kuf-pc-menu] PC Settings opened",
    "[kuf-pc-menu] PC Settings closed",
]

[format]
width = 1280
height = 720
