# The expanded sensitivity range through the menu (M6B final verification; category pages M7 feature 3), in-game with
# the keyboard: CONTINUE from build/m6-saves/celine-shadows-depths-1 (read only; the run gets a copy), options menu
# (Escape), Settings, PC Settings, Controls. Mouse Horizontal Right x17 (4 -> 20, the maximum: the last Right does
# nothing), Down, Mouse Vertical Right x17 (4 -> 20), Down, Stick Sensitivity Right x16 (5 -> 20). Back to the
# categories, Back saves; the file holds the levels (20/20/20; the other settings at their defaults). The next run
# (pc_settings_sensitivity_persist) starts from this run's pc_settings.toml.

