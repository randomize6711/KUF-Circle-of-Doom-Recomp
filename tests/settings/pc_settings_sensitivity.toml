# The expanded sensitivity range through the menu (M6B final verification; categories since M7; K66, M15.1), in-game with the
# keyboard: CONTINUE from build/m6-saves/celine-shadows-depths-1 (read only; the run gets a copy), options menu (Escape),
# Settings, Mouse & Keyboard. Mouse Horizontal Right x17 (4 -> 20, the maximum: the last Right does nothing), Down, Mouse Vertical
# Right x17 (4 -> 20). Back, Controller, Stick Settings: Stick Horizontal Right x16 (5 -> 20). Back out saves; the file holds the
