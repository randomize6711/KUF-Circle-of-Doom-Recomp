# M6D K44 (docs/HIGH_FPS.md section 18): --kuf_frame_rate=60, the tick at gameplay+600 (tick 2100 on this route)
# held 16000 us before it starts, so it begins late by nearly a frame step, as the host's load can make it; the
# presentation clock traced from tick 2050 for 900 ticks. k44_check.py checks the frames per tick after it.
[scenario]
description = "M6D K44 at 60 fps: the K44 fault injected: the frame rate locks after a late tick (k44_check.py must see it)"
seconds = 150
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
script_file = "tick_route.txt"
args = ["--kuf_frame_rate=60", "--kuf_debug_tick_stall_at=2100", "--kuf_debug_tick_stall_us=16000",
        "--kuf_trace_frame_clock=2050", "--kuf_present_clock_keep_late_phase=true"]
capture_frames = []
expect_saves_unchanged = true
log_expect = ["[kuf-input] context: gameplay", "[kuf-clock] test stall: tick 2100"]
