# Rules shared by shadows_depths_continue.toml and shadows_depths_reload.toml: every value, list row, the area
# banner and the quest text equal the earlier run's. Status values, banner, panels: glyph pixels with luma > 200
# (metric text). List rows and the name line: text dimmer than 200, so metric text_rel (brighter than the row's
# own background by 40), which also reads a highlighted row. Both runs use the same script, so the cursor is on
# the same row. Measured: identical rows 0.00; any two different rows >= 4.0. Rectangles as in
# tests/save/save_continue.toml; inventory rows 28 px apart (row 1, selected and pulsing, not compared).
[format]
width = 1280
height = 720

[[range]]
name = "all captures are real images"
frames = [1, 1000000]
width = 1280
height = 720

[[region_diff]]
name = "area banner"
a = "prev:arrive_2"
b = "arrive_2"
rect = [430, 400, 850, 430]
metric = "text"
text_threshold = 200.0
max_mean_diff = 1.0

[[region_diff]]
name = "status level"
a = "prev:status"
b = "status"
rect = [990, 50, 1150, 84]
metric = "text"
text_threshold = 150.0
max_mean_diff = 1.0

# The large name glyphs vary with the scene behind the panel (same name up to 1.3, another name >= 19)
