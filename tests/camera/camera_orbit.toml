# The modern camera's vertical orbit (M6B correction), measured every frame (--kuf_trace_camera_orbit: the
# rendered camera after the game's collision against the pivot, the game's camera target on the character).
# CONTINUE from build/m6-saves/celine-shadows-depths-1. Slow sweeps (mouse, 10 counts = 1 degree per frame) from
# the default view up to the upper limit and down to the lower limit and back; then fast ones (the whole range
# in a few frames); then the right stick held up and down (controller).
# Checks per segment (every frame): the camera stays aimed at the pivot; it follows the requested orbit
# exactly (off orbit: the rendered eye against the orbit's eye; the game's position smoothing once cut a chord
# here); slow moves are continuous (eye movement per frame and its change); the limits are reached; the eye
# goes below the pivot when looking up but stays above the ground (30 units over the character's feet); the
# camera never comes close to the character.

[scenario]
description = "Modern camera vertical orbit: continuity, aim at the character, height, collision, slow and fast"
seconds = 150
saves_from_dir = "build/m6-saves/celine-shadows-depths-1"
args = ["--kuf_trace_camera_orbit=true", "--kuf_input_script_pad=xbox360"]
script_file = "camera_orbit.kufscript"
capture_frames = []
log_expect = ["[kuf-input] context: gameplay"]

[[scenario.log_value]]
name = "slow_up: aim off the pivot"
after = "log mark slow_up"
before = "log mark top_slow"
pattern = 'aim off pivot ([0-9.]+) deg'
which = "max"
max = 0.5

[[scenario.log_value]]
name = "slow_up: off the orbit"
after = "log mark slow_up"
before = "log mark top_slow"
pattern = 'off orbit ([0-9.]+),'
which = "max"
max = 1.0

[[scenario.log_value]]
name = "slow_up: closest to the pivot"
after = "log mark slow_up"
before = "log mark top_slow"
pattern = 'orbit: pitch -?[0-9.]+ deg, distance ([0-9.]+),'
which = "min"
min = 140.0

[[scenario.log_value]]
name = "slow_up: lowest eye above the feet"
after = "log mark slow_up"
before = "log mark top_slow"
pattern = 'eye above feet (-?[0-9.]+),'
which = "min"
min = 25.0

[[scenario.log_value]]
name = "slow_down: aim off the pivot"
after = "log mark slow_down"
before = "log mark bottom_slow"
pattern = 'aim off pivot ([0-9.]+) deg'
which = "max"
max = 0.5

[[scenario.log_value]]
name = "slow_down: off the orbit"
