[format]
width = 1280
height = 720

# K38: every scripted look and stick change reaches exactly one game tick (the camera's per-tick trace: one line
# per tick between items one tick apart). Before the fix the script applied its items at presents, and a tick
# could see two items or none.
[[scenario.input_ticks]]
name = "scripted camera input"
after = "log mark slow_up"
before = "log mark end"
item = ' look |pad axis'
update = '\[kuf-cam\] orbit:'
