before = "log mark level"
pattern = 'orbit: pitch (-?[0-9.]+) deg'
which = "min"
min = -85.01
max = -84.5

[[scenario.log_value]]
name = "fast: upper limit reached"
after = "log mark fast"
before = "log mark stick"
pattern = 'orbit: pitch (-?[0-9.]+) deg'
which = "max"
min = 84.5
max = 85.01

[[scenario.log_value]]
