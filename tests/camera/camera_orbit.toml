[[scenario.log_value]]
name = "stick: largest eye step"
after = "log mark stick"
before = "log mark end"
pattern = 'step ([0-9.]+),'
which = "max"
# The stick turns up to 1.7 degrees per frame; sliding in along the ground that is up to 60 units (the distance
# no longer shrinks while the view is pitched: the collision's feedback is made in the game's terms).
# Measured (M6B final verification): the largest step, 50.3, is where the eye meets the ground at the lower
# limit: 19.1 units of it the turn itself (as before: 15-20) and 46.7 the game's ground slide pulling the eye in.
# The approved orbit before the distance setting slid from 637 units (its distance had crept in while pitched)
# and measured 37.3 under the bound of 45; at the game's own 707 units the same slide is longer per frame. The
# bound keeps the same margin (60 / 50.3 as 45 / 37.3); a snap of the eye (tens to hundreds of units in one
# frame) still fails it (tests/tools/test_camera_checks.py: a 75-unit jump).
max = 60.0

[[scenario.log_value]]
name = "stick: largest step change"
after = "log mark stick"
before = "log mark end"
pattern = 'jerk ([0-9.]+),'
which = "max"
# The script moves the stick from rest to full deflection, and releases it, in one frame (once while the camera
# slides in along the ground at 40 units per frame): the eye starts and stops with the input. Bounded by the
# largest step, so only a jump beyond a stop fails (the mouse sweeps above keep the tight bound).
max = 60.0

[[scenario.log_value]]
name = "upper limit"
after = "log mark top_slow"
before = "log mark slow_down"
pattern = 'orbit: pitch (-?[0-9.]+) deg'
which = "min"
min = 84.5
max = 85.01

[[scenario.log_value]]
name = "upper limit: eye below the pivot"
after = "log mark top_slow"
before = "log mark slow_down"
pattern = 'eye above feet (-?[0-9.]+),'
which = "max"
max = 60.0

[[scenario.log_value]]
name = "lower limit"
