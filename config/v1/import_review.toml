# Manual review of imports the game exercised in the M2 audit runs (tools/import_audit_report.py --reviewed).
# status: one of "Fully implemented", "Partially implemented", "Intentionally stubbed", "Unused",
# "Not yet investigated".

[RtlRaiseException]
status = "Partially implemented"
note = "Runtime handles only SetThreadName (0x406D1388); other codes Break and return. Our RaiseException guard (src/runtime/eh_trace.cpp) passes thread naming through and fails fast on anything else. Observed: 2 calls, both thread naming."

[NtQueryInformationFile]
status = "Fully implemented"
note = "Reviewed: the unimplemented info classes (XCTD compression) log at error level, none logged; XFileSectorInformation is a debug-logged stub, not hit."

[NtReadFile]
status = "Fully implemented"
note = "Reviewed: completes synchronously (async TODO) and signals the event/IOSB; 6,013 reads in 5 min without error."

[NtCreateFile]
status = "Fully implemented"
note = "Reviewed: fail-path marker is the normal not-found return. Game folder is read-only; write opens downgrade to read (Xenia behaviour), rename refused (patch 0001)."

[NtSetInformationFile]
